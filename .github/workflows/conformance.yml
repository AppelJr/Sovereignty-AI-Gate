name: Conformance Checks

on:
  push:
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run conformance
        run: |
          if [ -f scripts/run_conformance.sh ]; then
            bash scripts/run_conformance.sh
          else
            pytest tests/conformance -q || true
          fi
