name: Conformance Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check pytest
      - name: Run RFC conformance tests
        run: |
          test -n "$(find RFC -maxdepth 1 -type f -name 'test_rfc*.py' -print -quit)"
          python -m pytest -q RFC/test_rfc*.py
