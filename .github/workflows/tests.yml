name: Python Tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Run maintained contract, Genesis adapter, and RFC tests
        run: |
          python -m pytest -q \
            tests/test_devassist_contracts.py \
            tests/test_genesis_adapter.py \
            tests/test_genesis_bridge.py \
            RFC/test_rfc*.py
